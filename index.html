<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌡️</text></svg>">
</head>

<body>
    <div id="weather-bg" class="weather-bg"></div>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">WEATHER<span class="brand-accent">Z</span></div>
            <div class="search-box">
                <label for="search-input" class="visually-hidden">City name</label>
                <div class="search-wrapper">
                    <span class="search-icon" aria-hidden="true">🔍</span>
                    <input type="text" id="search-input" placeholder="Enter city name"
                        onkeypress="if(event.key === 'Enter') getWeather()">
                    <button id="search-btn" onclick="getWeather()">Search</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-div">

        <section id="currentWeather" aria-live="polite"></section>

        <section class="highlights-section">
            <h2 id="highlightsTitle" class="section-eyebrow" style="display:none;">Today's Highlights</h2>
            <div id="highlightsContainer" class="highlights-grid"></div>
        </section>

        <section class="forecast-section">
            <h2 id="forecastTitle" class="section-eyebrow" style="display:none;">3-Day Outlook</h2>
            <div id="forecastContainer" class="forecast-row"></div>
        </section>

        <section class="cities-section">
            <h2 class="section-eyebrow">Major Cities</h2>
            <div class="table-wrapper">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th>City</th>
                            <th>Temp</th>
                            <th>Humidity</th>
                            <th>Rain</th>
                        </tr>
                    </thead>
                    <tbody id="majorCitiesTable"></tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <p>Live data via WeatherAPI.com</p>
    </footer>

    <script>

        const API_KEY = "5681555b3ddb46be902105138251911";
        const majorCities = ["Mumbai", "New Delhi", "Bangalore", "Chennai", "Kolkata"];

        // Condition codes: https://www.weatherapi.com/docs/weather_conditions.json
        function getWeatherTheme(code, isDay) {
            const rainCodes = [1063, 1150, 1153, 1168, 1171, 1180, 1183, 1186, 1189, 1192, 1195, 1198, 1201, 1240, 1243, 1246, 1087, 1273, 1276, 1279, 1282];
            const snowCodes = [1066, 1114, 1117, 1210, 1213, 1216, 1219, 1222, 1225, 1255, 1258, 1261, 1264];
            if (rainCodes.includes(code)) return 'rain';
            if (snowCodes.includes(code)) return 'snow';
            if (!isDay) return 'night';
            if (code === 1000) return 'sunny';
            return 'cloudy';
        }

        // Spawns real DOM elements that fall via CSS animation — not a
        // repeating background pattern. negative animation-delay is the key
        // trick: it makes the animation start mid-cycle immediately, so drops
        // are already staggered across the screen on the very first frame
        // instead of all starting together at the top.
        function spawnWeatherParticles(theme) {
            const container = document.getElementById('weather-bg');
            container.innerHTML = '';

            if (theme === 'rain') {
                for (let i = 0; i < 70; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'raindrop';
                    const duration = 1.1 + Math.random() * 0.6;
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.height = (14 + Math.random() * 14) + 'px';
                    drop.style.animationDuration = duration + 's';
                    drop.style.animationDelay = -(Math.random() * duration) + 's';
                    container.appendChild(drop);
                }
            } else if (theme === 'snow') {
                for (let i = 0; i < 50; i++) {
                    const flake = document.createElement('div');
                    flake.className = 'snowflake';
                    const duration = 5 + Math.random() * 6;
                    const size = (2 + Math.random() * 3) + 'px';
                    flake.style.left = Math.random() * 100 + '%';
                    flake.style.width = size;
                    flake.style.height = size;
                    flake.style.animationDuration = duration + 's';
                    flake.style.animationDelay = -(Math.random() * duration) + 's';
                    flake.style.setProperty('--drift', (Math.random() * 40 - 20) + 'px');
                    container.appendChild(flake);
                }
            }
        }

        // AQI: WeatherAPI's "us-epa-index" is a 1-6 severity bucket, not a raw
        // AQI number. Map it to the standard US EPA label people recognize.
        function getAqiLabel(index) {
            const labels = ['—', 'Good', 'Moderate', 'Unhealthy*', 'Unhealthy', 'Very Unhealthy', 'Hazardous'];
            return labels[index] || '—';
        }

        // Swaps an element's content with a fade-out -> replace -> fade-in
        // sequence instead of an instant innerHTML swap. The 250ms timeout
        // must match the CSS transition duration on .fade-out, otherwise the
        // content gets replaced mid-fade and the effect looks broken.
        function swapWithFade(el, html) {
            return new Promise(resolve => {
                el.classList.add('fade-out');
                setTimeout(() => {
                    el.innerHTML = html;
                    el.classList.remove('fade-out');
                    resolve();
                }, 250);
            });
        }

        const skeletonCard = `
        <div class="current-panel">
            <div class="current-hero">
                <div class="current-left">
                    <div class="skeleton-block" style="width:110px;height:12px;"></div>
                    <div class="skeleton-block" style="width:170px;height:64px;margin-top:6px;"></div>
                    <div class="skeleton-block" style="width:130px;height:14px;"></div>
                </div>
                <div class="skeleton-block" style="width:88px;height:88px;border-radius:50%;"></div>
            </div>
            <div class="metric-row">
                ${'<div class="metric"><div class="skeleton-block" style="width:100%;height:44px;"></div></div>'.repeat(6)}
            </div>
        </div>
    `;

        // WeatherAPI gives wind_dir as a compass abbreviation (e.g. "WSW").
        // This maps it to the full name for a hover tooltip only — the
        // visible text stays abbreviated so the compact card layout doesn't break.
        const windDirNames = {
            N: 'North', NNE: 'North-Northeast', NE: 'Northeast', ENE: 'East-Northeast',
            E: 'East', ESE: 'East-Southeast', SE: 'Southeast', SSE: 'South-Southeast',
            S: 'South', SSW: 'South-Southwest', SW: 'Southwest', WSW: 'West-Southwest',
            W: 'West', WNW: 'West-Northwest', NW: 'Northwest', NNW: 'North-Northwest'
        };

        function getWindDirFullName(dir) {
            return windDirNames[dir] || dir;
        }

        async function getWeather(defaultCity) {

            const city = defaultCity || document.getElementById("search-input").value.trim();
            if (!city) return;

            const currentDiv = document.getElementById("currentWeather");
            const highlightsTitle = document.getElementById("highlightsTitle");
            const highlightsDiv = document.getElementById("highlightsContainer");
            const forecastTitle = document.getElementById("forecastTitle");
            const forecastDiv = document.getElementById("forecastContainer");
            const searchBtn = document.getElementById("search-btn");

            searchBtn.disabled = true;
            searchBtn.textContent = "Searching…";
            await swapWithFade(currentDiv, skeletonCard);

            try {
                const response = await fetch(
                    `https://api.weatherapi.com/v1/forecast.json?key=${API_KEY}&q=${city}&days=7&aqi=yes`
                );

                const data = await response.json();

                if (data.error) {
                    await swapWithFade(currentDiv, `<p class="error-msg">Invalid city name!</p>`);
                    highlightsTitle.style.display = "none";
                    highlightsDiv.innerHTML = "";
                    forecastTitle.style.display = "none";
                    forecastDiv.innerHTML = "";
                    return;
                }

                const c = data.current;
                const updatedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                // location.localtime is "YYYY-MM-DD HH:MM" in the city's own
                // timezone (not the visitor's) — replace the space with "T"
                // so the Date constructor parses it reliably across browsers.
                const cityLocalTime = new Date(data.location.localtime.replace(' ', 'T'))
                    .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Apply dynamic background theme
                const weatherTheme = getWeatherTheme(c.condition.code, c.is_day);
                document.body.className = 'theme-' + weatherTheme;
                spawnWeatherParticles(weatherTheme);

                const today = data.forecast.forecastday[0].day;

                const currentCardHTML = `
        <div class="current-panel">
            <div class="current-hero">
                <div class="current-left">
                    <p class="city-name"><span class="pin">📍</span>${data.location.name}</p>
                    <p class="city-time">${cityLocalTime} local time</p>
                    <span class="temp-readout">${Math.round(c.temp_c)}°C</span>
                    <p class="condition-text">${c.condition.text}</p>
                    <p class="hl-row">
                        <span class="hl-high">Today's High: ${Math.round(today.maxtemp_c)}°</span>
                        <span class="hl-divider">·</span>
                        <span class="hl-low">Today's Low: ${Math.round(today.mintemp_c)}°</span>
                    </p>
                </div>
                <img src="https:${c.condition.icon.replace('64x64', '128x128')}" alt="${c.condition.text}" class="hero-icon">
            </div>
            <div class="metric-row">
                <div class="metric">
                    <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 4v9.5a3.5 3.5 0 1 1-4 0V4a2 2 0 0 1 4 0Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></svg></span>
                    <span class="metric-label">Feels Like</span>
                    <span class="metric-value">${Math.round(c.feelslike_c)}°</span>
                </div>
                <div class="metric">
                    <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5c3 4 6 8.2 6 11.5a6 6 0 1 1-12 0c0-3.3 3-7.5 6-11.5Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                    <span class="metric-label">Humidity</span>
                    <span class="metric-value">${c.humidity}%</span>
                </div>
                <div class="metric">
                    <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3M3 16h14a3 3 0 1 1-3 3M3 12h17a2.5 2.5 0 1 0-2.5-2.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                    <span class="metric-label">Wind</span>
                    <span class="metric-value">${c.wind_kph} km/h</span>
                </div>
                <div class="metric" title="${getWindDirFullName(c.wind_dir)}">
                    <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><path d="M15 9l-2 6-6 2 2-6 6-2Z" stroke-width="2" stroke-linejoin="round"/></svg></span>
                    <span class="metric-label">Wind Dir</span>
                    <span class="metric-value">${c.wind_dir}</span>
                </div>
                <div class="metric">
                    <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-1-7.87A5 5 0 0 1 15.5 8a4.5 4.5 0 0 1 .5 9H7Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                    <span class="metric-label">Cloud</span>
                    <span class="metric-value">${c.cloud}%</span>
                </div>
                <div class="metric">
                    <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-1-7.87A5 5 0 0 1 15.5 6a4.5 4.5 0 0 1 .5 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 19l1.5-2.5M12 19l1.5-2.5M16 19l1.5-2.5" stroke-width="2" stroke-linecap="round"/></svg></span>
                    <span class="metric-label">Rain</span>
                    <span class="metric-value">${today.daily_chance_of_rain}%</span>
                </div>
            </div>
            <p class="updated-stamp">Last updated ${updatedAt}</p>
        </div>
    `;
                await swapWithFade(currentDiv, currentCardHTML);

                // Today's Highlights
                highlightsTitle.style.display = "block";
                const epaIndex = data.current.air_quality ? data.current.air_quality['us-epa-index'] : null;
                highlightsDiv.innerHTML = `
        <div class="metric">
            <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0" stroke-width="2" stroke-linecap="round"/><path d="M12 18l3-4" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="18" r="1.2" fill="currentColor"/></svg></span>
            <span class="metric-label">Pressure</span>
            <span class="metric-value">${c.pressure_mb} mb</span>
        </div>
        <div class="metric">
            <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg></span>
            <span class="metric-label">Visibility</span>
            <span class="metric-value">${c.vis_km} km</span>
        </div>
        <div class="metric">
            <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" stroke-width="2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke-width="2" stroke-linecap="round"/></svg></span>
            <span class="metric-label">UV Index</span>
            <span class="metric-value">${c.uv}</span>
        </div>
        <div class="metric">
            <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="14.5" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="14.5" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/></svg></span>
            <span class="metric-label">AQI</span>
            <span class="metric-value">${epaIndex ? getAqiLabel(epaIndex) : '—'}</span>
        </div>
        <div class="metric">
            <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 18h20M5 18a7 7 0 0 1 14 0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 2v4M9 5l3-3 3 3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="metric-label">Sunrise</span>
            <span class="metric-value">${data.forecast.forecastday[0].astro.sunrise}</span>
        </div>
        <div class="metric">
            <span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 18h20M5 18a7 7 0 0 1 14 0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 2v4M9 3l3 3 3-3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="metric-label">Sunset</span>
            <span class="metric-value">${data.forecast.forecastday[0].astro.sunset}</span>
        </div>
    `;

                // Forecast
                forecastTitle.style.display = "block";
                forecastDiv.innerHTML = "";

                data.forecast.forecastday.forEach((day, index) => {
                    const dayLabel = new Date(day.date).toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
                    const todayClass = index === 0 ? ' fore-today' : '';
                    forecastDiv.innerHTML += `
            <div class='fore-container${todayClass}'>
                <span class="day-label">${dayLabel}</span>
                <img src="https:${day.day.condition.icon}" alt="${day.day.condition.text}">
                <span class="fore-temp">${Math.round(day.day.maxtemp_c)}°</span>
                <span class="fore-rain"><svg viewBox="0 0 24 24"><path d="M12 2c4 5 7 9 7 13a7 7 0 1 1-14 0c0-4 3-8 7-13Z" stroke-width="2" stroke-linejoin="round"/></svg>${day.day.daily_chance_of_rain}%</span>
            </div>
        `;
                });

            } catch (err) {
                await swapWithFade(currentDiv, `<p class="error-msg">Couldn't reach the weather service. Check your connection and try again.</p>`);
                highlightsTitle.style.display = "none";
                highlightsDiv.innerHTML = "";
                forecastTitle.style.display = "none";
                forecastDiv.innerHTML = "";
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = "Search";
            }
        }

        // Major cities
        async function loadMajorCities() {

            const table = document.getElementById("majorCitiesTable");

            const rows = await Promise.all(majorCities.map(async city => {
                try {
                    const response = await fetch(
                        `https://api.weatherapi.com/v1/forecast.json?key=${API_KEY}&q=${city}&days=1&aqi=no`
                    );
                    const data = await response.json();
                    if (data.error) return "";

                    const rainChance = data.forecast.forecastday[0].day.daily_chance_of_rain;

                    return `
                <tr>
                    <td>${city}</td>
                    <td>${Math.round(data.current.temp_c)}°C</td>
                    <td>${data.current.humidity}%</td>
                    <td>${rainChance}%</td>
                </tr>
            `;
                } catch (err) {
                    return "";
                }
            }));

            table.innerHTML = rows.join("");
        }

        loadMajorCities();
        getWeather("New Delhi");

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">WEATHER<span class="brand-accent">Z</span></div>
            <div class="search-box">
                <label for="search-input" class="visually-hidden">City name</label>
                <input type="text" id="search-input" placeholder="Enter city name"
                    onkeypress="if(event.key === 'Enter') getWeather()">
                <button onclick="getWeather()">Search</button>
            </div>
        </div>
    </header>

    <main class="main-div">

        <section id="currentWeather" aria-live="polite"></section>

        <section class="forecast-section">
            <h2 id="forecastTitle" class="section-eyebrow" style="display:none;">3-Day Outlook</h2>
            <div id="forecastContainer" class="forecast-row"></div>
        </section>

        <section class="cities-section">
            <h2 class="section-eyebrow">Major Cities</h2>
            <div class="table-wrapper">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th>City</th>
                            <th>Temp</th>
                            <th>Humidity</th>
                            <th>Wind</th>
                        </tr>
                    </thead>
                    <tbody id="majorCitiesTable"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script>

        const API_KEY = "5681555b3ddb46be902105138251911";
        const majorCities = ["Mumbai", "New Delhi", "Bangalore", "Chennai", "Kolkata"];

        async function getWeather() {

            const city = document.getElementById("search-input").value.trim();
            if (!city) return;

            const currentDiv = document.getElementById("currentWeather");
            const forecastTitle = document.getElementById("forecastTitle");
            const forecastDiv = document.getElementById("forecastContainer");

            currentDiv.innerHTML = `<p class="loading-msg">Fetching weather data…</p>`;

            try {
                const response = await fetch(
                    `https://api.weatherapi.com/v1/forecast.json?key=${API_KEY}&q=${city}&days=7`
                );

                const data = await response.json();

                if (data.error) {
                    currentDiv.innerHTML = `<p class="error-msg">Invalid city name!</p>`;
                    forecastTitle.style.display = "none";
                    forecastDiv.innerHTML = "";
                    return;
                }

                const c = data.current;

                currentDiv.innerHTML = `
        <div class="current-panel">
            <div class="current-top">
                <div class="current-location">
                    <span class="eyebrow">Current Conditions</span>
                    <h1 class="city-name">${data.location.name}</h1>
                    <p class="condition-text">${c.condition.text}</p>
                </div>
                <div class="current-readout">
                    <img src="https:${c.condition.icon}" alt="${c.condition.text}">
                    <span class="temp-readout">${Math.round(c.temp_c)}°</span>
                </div>
            </div>
            <div class="metric-row">
                <div class="metric">
                    <span class="metric-label">Feels Like</span>
                    <span class="metric-value">${Math.round(c.feelslike_c)}°C</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Humidity</span>
                    <span class="metric-value">${c.humidity}%</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Wind</span>
                    <span class="metric-value">${c.wind_kph} km/h</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Wind Dir</span>
                    <span class="metric-value">${c.wind_dir}</span>
                </div>
            </div>
        </div>
    `;

                // Forecast
                forecastTitle.style.display = "block";
                forecastDiv.innerHTML = "";

                data.forecast.forecastday.forEach(day => {
                    const dayLabel = new Date(day.date).toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
                    forecastDiv.innerHTML += `
            <div class='fore-container'>
                <span class="day-label">${dayLabel}</span>
                <img src="https:${day.day.condition.icon}" alt="${day.day.condition.text}">
                <span class="fore-temp">${Math.round(day.day.maxtemp_c)}°</span>
            </div>
        `;
                });

            } catch (err) {
                currentDiv.innerHTML = `<p class="error-msg">Couldn't reach the weather service. Check your connection and try again.</p>`;
                forecastTitle.style.display = "none";
                forecastDiv.innerHTML = "";
            }
        }

        // Major cities
        async function loadMajorCities() {

            const table = document.getElementById("majorCitiesTable");

            const rows = await Promise.all(majorCities.map(async city => {
                try {
                    const response = await fetch(
                        `https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=${city}&aqi=no`
                    );
                    const data = await response.json();
                    if (data.error) return "";

                    return `
                <tr>
                    <td>${city}</td>
                    <td>${Math.round(data.current.temp_c)}°C</td>
                    <td>${data.current.humidity}%</td>
                    <td>${data.current.wind_kph} km/h</td>
                </tr>
            `;
                } catch (err) {
                    return "";
                }
            }));

            table.innerHTML = rows.join("");
        }

        loadMajorCities();

    </script>

</body>

</html>

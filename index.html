<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌡️</text></svg>">
</head>

<body>
    <div id="weather-bg" class="weather-bg"></div>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">WEATHER<span class="brand-accent">Z</span></div>
            <div class="search-box">
                <label for="search-input" class="visually-hidden">City name</label>
                <input type="text" id="search-input" placeholder="Enter city name"
                    onkeypress="if(event.key === 'Enter') getWeather()">
                <button id="search-btn" onclick="getWeather()">Search</button>
            </div>
        </div>
    </header>

    <main class="main-div">

        <section id="currentWeather" aria-live="polite"></section>

        <section class="forecast-section">
            <h2 id="forecastTitle" class="section-eyebrow" style="display:none;">3-Day Outlook</h2>
            <div id="forecastContainer" class="forecast-row"></div>
        </section>

        <section class="cities-section">
            <h2 class="section-eyebrow">Major Cities</h2>
            <div class="table-wrapper">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th>City</th>
                            <th>Temp</th>
                            <th>Humidity</th>
                            <th>Wind</th>
                        </tr>
                    </thead>
                    <tbody id="majorCitiesTable"></tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <p>Live data via WeatherAPI.com</p>
    </footer>

    <script>

        const API_KEY = "5681555b3ddb46be902105138251911";
        const majorCities = ["Mumbai", "New Delhi", "Bangalore", "Chennai", "Kolkata"];

        // Condition codes: https://www.weatherapi.com/docs/weather_conditions.json
        function getWeatherTheme(code, isDay) {
            if (!isDay) return 'night';
            if (code === 1000) return 'sunny';
            const rainCodes = [1063, 1150, 1153, 1168, 1171, 1180, 1183, 1186, 1189, 1192, 1195, 1198, 1201, 1240, 1243, 1246, 1087, 1273, 1276, 1279, 1282];
            const snowCodes = [1066, 1114, 1117, 1210, 1213, 1216, 1219, 1222, 1225, 1255, 1258, 1261, 1264];
            if (rainCodes.includes(code)) return 'rain';
            if (snowCodes.includes(code)) return 'snow';
            return 'cloudy';
        }

        async function getWeather(defaultCity) {

            const city = defaultCity || document.getElementById("search-input").value.trim();
            if (!city) return;

            const currentDiv = document.getElementById("currentWeather");
            const forecastTitle = document.getElementById("forecastTitle");
            const forecastDiv = document.getElementById("forecastContainer");
            const searchBtn = document.getElementById("search-btn");

            currentDiv.innerHTML = `<p class="loading-msg">Fetching weather data…</p>`;
            searchBtn.disabled = true;
            searchBtn.textContent = "Searching…";

            try {
                const response = await fetch(
                    `https://api.weatherapi.com/v1/forecast.json?key=${API_KEY}&q=${city}&days=7`
                );

                const data = await response.json();

                if (data.error) {
                    currentDiv.innerHTML = `<p class="error-msg">Invalid city name!</p>`;
                    forecastTitle.style.display = "none";
                    forecastDiv.innerHTML = "";
                    return;
                }

                const c = data.current;
                const updatedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Apply dynamic background theme
                document.body.className = 'theme-' + getWeatherTheme(c.condition.code, c.is_day);

                const today = data.forecast.forecastday[0].day;

                currentDiv.innerHTML = `
        <div class="current-panel">
            <div class="current-hero">
                <div class="current-left">
                    <p class="city-name"><span class="pin">📍</span>${data.location.name}</p>
                    <span class="temp-readout">${Math.round(c.temp_c)}°C</span>
                    <p class="condition-text">
                        <img src="https:${c.condition.icon}" alt="${c.condition.text}" class="inline-icon">
                        ${c.condition.text}
                    </p>
                    <p class="hl-row">
                        <span class="hl-high">Today's High: ${Math.round(today.maxtemp_c)}°</span>
                        <span class="hl-divider">·</span>
                        <span class="hl-low">Today's Low: ${Math.round(today.mintemp_c)}°</span>
                    </p>
                    <p class="feels-line">Feels Like ${Math.round(c.feelslike_c)}°C</p>
                </div>
            </div>
            <div class="metric-row">
                <div class="metric">
                    <span class="metric-label">Humidity</span>
                    <span class="metric-value">${c.humidity}%</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Wind</span>
                    <span class="metric-value">${c.wind_kph} km/h</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Wind Dir</span>
                    <span class="metric-value">${c.wind_dir}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Cloud</span>
                    <span class="metric-value">${c.cloud}%</span>
                </div>
            </div>
            <p class="updated-stamp">Last updated ${updatedAt}</p>
        </div>
    `;

                // Forecast
                forecastTitle.style.display = "block";
                forecastDiv.innerHTML = "";

                data.forecast.forecastday.forEach(day => {
                    const dayLabel = new Date(day.date).toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
                    forecastDiv.innerHTML += `
            <div class='fore-container'>
                <span class="day-label">${dayLabel}</span>
                <img src="https:${day.day.condition.icon}" alt="${day.day.condition.text}">
                <span class="fore-temp">${Math.round(day.day.maxtemp_c)}°</span>
            </div>
        `;
                });

            } catch (err) {
                currentDiv.innerHTML = `<p class="error-msg">Couldn't reach the weather service. Check your connection and try again.</p>`;
                forecastTitle.style.display = "none";
                forecastDiv.innerHTML = "";
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = "Search";
            }
        }

        // Major cities
        async function loadMajorCities() {

            const table = document.getElementById("majorCitiesTable");

            const rows = await Promise.all(majorCities.map(async city => {
                try {
                    const response = await fetch(
                        `https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=${city}&aqi=no`
                    );
                    const data = await response.json();
                    if (data.error) return "";

                    return `
                <tr>
                    <td>${city}</td>
                    <td>${Math.round(data.current.temp_c)}°C</td>
                    <td>${data.current.humidity}%</td>
                    <td>${data.current.wind_kph} km/h</td>
                </tr>
            `;
                } catch (err) {
                    return "";
                }
            }));

            table.innerHTML = rows.join("");
        }

        loadMajorCities();
        getWeather("New Delhi");

    </script>

</body>

</html>
